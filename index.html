<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#020E18" />
    <meta name="color-scheme" content="dark" />
    <title>آن پرداز</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" /></noscript>
    <style>
      html,body{margin:0;width:100%;height:100%;background:#020e18}
      #boot-screen{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:#020e18;transition:opacity .18s ease}
      #boot-screen.is-hidden{opacity:0;pointer-events:none}
      #boot-screen img{width:92px;height:92px;object-fit:contain;display:block}
      #boot-screen .boot-name{position:absolute;top:calc(50% + 72px);font-family:system-ui,-apple-system,sans-serif;font-size:24px;font-weight:800;color:#f4fafc}
    </style>
  </head>
  <body>
    <div id="boot-screen" aria-label="در حال بارگذاری آن پرداز">
      <img src="/logo.png" alt="آن پرداز" />
      <div class="boot-name">آن پرداز</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
